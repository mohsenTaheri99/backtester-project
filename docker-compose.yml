services:
  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: backtester-backend
    ports:
      - "8000:8000"
    volumes:
      # Data is a bind mount so `fetch_data` results land on the host too.
      - ./backend/data:/app/data
      - ./backend/app:/app/app
    environment:
      DATA_DIR: /app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: backtester-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      # Keep the image's node_modules; do not shadow it with the host folder.
      - /app/node_modules
    environment:
      VITE_API_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
